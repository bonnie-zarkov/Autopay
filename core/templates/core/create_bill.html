{% extends "core/base.html" %}
{% block content %}
<div class="page-header">
  <div><span class="eyebrow">New payment</span><h1>Add a bill</h1></div>
  <a class="button ghost" href="{% url 'dashboard' %}">← Back</a>
</div>
<form class="form-card" method="post">
  {% csrf_token %}
  <div class="form-grid">
    <label>Bill name<input name="name" placeholder="December rent" required></label>
    <label>Category<select name="category">
      <option>RENT</option><option>SCHOOL</option><option>UTILITY</option><option>INTERNET</option>
      <option>INSURANCE</option><option>LOAN</option><option>SUPPLIER</option><option>OTHER</option>
    </select></label>
    <label>Merchant name<input name="merchant_name" placeholder="John Kamau" required></label>
    <label>Merchant phone<input name="merchant_phone" placeholder="254712345678" required></label>
    <label>Amount (KES)<input name="amount" type="number" min="1" step="0.01" placeholder="15000" required></label>
    <label>Due date<input name="due_date" type="date" required></label>
    <label>Payment reference<input name="reference" placeholder="RENT-DEC-2026" required></label>
    <label>Frequency<select name="frequency"><option>monthly</option><option>weekly</option><option>once</option></select></label>
  </div>
  <label>Account number (optional)<input name="account_number" placeholder="Account or customer number"></label>
  <div class="form-actions"><button class="button primary" type="submit">Create bill</button></div>
</form>
{% endblock %}
